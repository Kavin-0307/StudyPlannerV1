spring.application.name=SOS
spring.datasource.url=jdbc:mysql://localhost:3306/sos_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# application.properties
storage.base-path=${SOS_STORAGE_PATH:./sos_files}
jwt.secret=${JWT_SECRET}
docmind.api.url=${DOCMIND_URL:http://127.0.0.1:8000/api}
jwt.expiry-ms=1800000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB